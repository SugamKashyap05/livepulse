name: LivePulse CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: livepulse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
  ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  NEON_AUTH_BASE_URL: ${{ vars.NEON_AUTH_BASE_URL }}
  NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
  OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
  OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
  OLLAMA_SUMMARY_MODEL: ${{ vars.OLLAMA_SUMMARY_MODEL }}
  OLLAMA_DIGEST_MODEL: ${{ vars.OLLAMA_DIGEST_MODEL }}
  OLLAMA_CHAT_MODEL: ${{ vars.OLLAMA_CHAT_MODEL }}
  OLLAMA_MANAGER_MODEL: ${{ vars.OLLAMA_MANAGER_MODEL }}
  OLLAMA_FAST_MODEL: ${{ vars.OLLAMA_FAST_MODEL }}
  OLLAMA_EMBED_MODEL: ${{ vars.OLLAMA_EMBED_MODEL }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

jobs:
  quality-gate:
    name: Stage 1 - Quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Next.js build cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'prisma/**/*.prisma', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Secret scan
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: npm audit
        run: npm audit --audit-level=high

  security-gate:
    name: Stage 2 - Security gate
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@713efdd29472e3995f32a76202476b7e012e6931
        with:
          config: p/default

      - name: OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: livepulse
          path: .
          format: HTML
          out: reports
          args: >
            --enableRetired
            --failOnCVSS 8

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: owasp-dependency-check-report
          path: reports
          if-no-files-found: ignore

      - name: Header verify
        run: npm run ci:headers

      - name: Auth coverage
        run: npm run ci:auth-coverage

  pr-security-summary:
    name: PR security summary
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high

  build-database-gate:
    name: Stage 3 - Build + database gate
    runs-on: ubuntu-latest
    needs:
      - quality-gate
      - security-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Next.js build cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'prisma/**/*.prisma', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build

      - name: Bundle size check
        shell: bash
        run: |
          static_kb="$(du -sk .next/static | cut -f1)"
          echo "Next static bundle size: ${static_kb} KB"
          test "$static_kb" -lt "${MAX_NEXT_STATIC_KB:-51200}"

      - name: Detect Prisma schema changes
        id: prisma_changes
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.before || 'HEAD~1' }}" HEAD | grep -q '^prisma/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Neon validation branch
        if: steps.prisma_changes.outputs.changed == 'true' && env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != ''
        id: neon_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ env.NEON_API_KEY }}
          username: ${{ secrets.NEON_DATABASE_USERNAME }}
          password: ${{ secrets.NEON_DATABASE_PASSWORD }}
          database: ${{ vars.NEON_DATABASE_NAME }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

      - name: Run migrations on Neon validation branch
        if: steps.neon_branch.outputs.db_url != ''
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}

      - name: Validate migrated Neon branch
        if: steps.neon_branch.outputs.db_url != ''
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}

      - name: Delete Neon validation branch
        if: always() && steps.neon_branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@aed9ab1ec86e380312c7b0a9e29942e41349adf6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_id: ${{ steps.neon_branch.outputs.branch_id }}
          api_key: ${{ env.NEON_API_KEY }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

  deploy:
    name: Stage 4 - Deploy
    runs-on: ubuntu-latest
    needs: build-database-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    permissions:
      contents: read

    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project
        run: vercel pull --yes --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel output
        run: vercel build ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          else
            url="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")"
          fi
          echo "deployment_url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed ${url}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  pr-preview-deploy:
    name: Stage 4 - PR preview deploy
    runs-on: ubuntu-latest
    needs:
      - quality-gate
      - pr-security-summary
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    environment: preview
    permissions:
      contents: read
      pull-requests: write

    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview project
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel preview output
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy PR preview to Vercel
        id: deploy
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "deployment_url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed ${url}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment on PR with preview URL
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const deploymentUrl = '${{ steps.deploy.outputs.deployment_url }}';
            const body = `🚀 **Vercel Preview Deployment** is ready!\n\n- **Preview URL:** [${deploymentUrl}](${deploymentUrl})\n\nBuilt and deployed via CI/CD pipeline.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

  health-rollback:
    name: Stage 5 - Health + rollback
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke tests
        run: npm run ci:smoke
        env:
          LIVEPULSE_SMOKE_BASE_URL: ${{ needs.deploy.outputs.deployment_url }}

      - name: Auto-revert failed production deployment
        if: failure() && github.ref_name == 'main'
        run: vercel rollback ${{ needs.deploy.outputs.deployment_url }} --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  pr-preview-health:
    name: Stage 5 - PR preview health
    runs-on: ubuntu-latest
    needs: pr-preview-deploy
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke tests
        run: npm run ci:smoke
        env:
          LIVEPULSE_SMOKE_BASE_URL: ${{ needs.pr-preview-deploy.outputs.deployment_url }}
